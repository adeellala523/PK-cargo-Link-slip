    <!-- PK Cargo Link loading splash: animated 3D-style truck on a road,
         shown until React mounts so visitors never see a blank page -->
    <style>
      #pkcl-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(180deg, #fef9ef 0%, #fdf3e1 45%, #f7f3ea 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; transition: opacity .45s ease; overflow: hidden;
      }
      #pkcl-splash.pkcl-splash-hide { opacity: 0; pointer-events: none; }
      .pkcl-road-wrap { width: 100%; max-width: 420px; padding: 0 24px; }
      .pkcl-truck-svg { width: 100%; height: auto; display: block; overflow: visible; }
      /* Truck body gentle bounce */
      .pkcl-truck-body { animation: pkcl-bounce 1.1s ease-in-out infinite; transform-origin: center; }
      @keyframes pkcl-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      /* Spinning wheels */
      .pkcl-wheel { animation: pkcl-spin 0.7s linear infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pkcl-spin { to { transform: rotate(360deg); } }
      /* Moving road dashes */
      .pkcl-dash { animation: pkcl-road 0.6s linear infinite; }
      @keyframes pkcl-road { to { transform: translateX(-40px); } }
      /* Moving clouds */
      .pkcl-cloud { animation: pkcl-cloud 7s linear infinite; }
      .pkcl-cloud.c2 { animation-duration: 11s; animation-delay: -4s; }
      @keyframes pkcl-cloud { from { transform: translateX(120px); } to { transform: translateX(-420px); } }
      .pkcl-splash-sub { color: #0B2545; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, sans-serif; }
      .pkcl-splash-sub .dots::after { content: ''; animation: pkcl-dots 1.2s steps(4) infinite; }
      @keyframes pkcl-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    </style>

    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Gentle update: don't force-reload (that can drop login state mid-write).
            // Show a small "new version" banner; reload only when user taps it or page is hidden.
            let updateReady = false;
            const showUpdateBanner = () => {
              if (document.getElementById('pkcl-update-banner')) return;
              const b = document.createElement('div');
              b.id = 'pkcl-update-banner';
              b.dir = 'rtl';
              b.innerHTML = '<span>✨ نیا ورژن دستیاب ہے</span><button id="pkcl-update-btn" style="background:#B5E61D;color:#111;font-weight:800;border:none;border-radius:999px;padding:8px 18px;margin-right:10px;cursor:pointer;font-family:inherit;">اپڈیٹ کریں</button>';
              b.style.cssText = 'position:fixed;bottom:90px;left:16px;right:16px;z-index:9999;background:#111;color:#fff;border-radius:18px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-family:inherit;font-size:14px;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.3);';
              document.body.appendChild(b);
              document.getElementById('pkcl-update-btn').addEventListener('click', () => window.location.reload());
            };
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                    updateReady = true;
                    // Reload silently only if the page is hidden (user not actively using it)
                    if (document.visibilityState === 'hidden') {
                      window.location.reload();
                    } else {
                      showUpdateBanner();
                    }
                  }
                });
              }
            });
            // If user switches away with a pending update, apply it then
            document.addEventListener('visibilitychange', () => {
              if (updateReady && document.visibilityState === 'hidden') {
                window.location.reload();
              }
            });
            // Check for updates on every page load
            if (reg.update) reg.update().catch(() => {});
          }).catch(() => {});
        });
      }
    </script>
