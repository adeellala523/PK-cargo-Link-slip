<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="Permissions-Policy" content="microphone=(self '*')" />
    <title>PK Cargo Link — ڈیجیٹل کارگو، لوڈ سلپ اور ٹرانسپورٹ پلیٹ فارم</title>
    <meta name="description" content="PK Cargo Link کے ذریعے لوڈ تلاش کریں، ڈیجیٹل لوڈ سلپ بنائیں، سلپ ویریفائی کریں اور کارگو کام آسان بنائیں۔" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#123A6D" />
    <meta name="application-name" content="PK Cargo Link" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PK Cargo Link" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- OpenGraph & Social Sharing Meta (Dynamic in slip.php) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="کارگو اڈا لوڈ سلپ" />
    <meta property="og:title" content="لوڈ سلپ – گڈز ٹرانسپورٹ اڈا" />
    <meta property="og:description" content="دستیاب مال، روٹ اور اڈا رابطہ کی تفصیلات۔" />
    <meta property="og:url" content="https://pkcargolink.com" />
    <meta property="og:image" content="https://pkcargolink.com/slip-preview.jpg?v=3" />
    <meta property="og:image:secure_url" content="https://pkcargolink.com/slip-preview.jpg?v=3" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ur_PK" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="لوڈ سلپ – گڈز ٹرانسپورٹ اڈا" />
    <meta name="twitter:description" content="دستیاب لوڈ کی تفصیلات اور اڈا رابطہ۔" />
    <meta name="twitter:image" content="https://pkcargolink.com/api/slip-image.php" />

    <!-- Font preload for Nafees Web Naskh -->
    <link rel="preload" href="/fonts/nafeesweb.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LogisticsService",
      "name": "PK Cargo Link",
      "url": "https://pkcargolink.com",
      "logo": "https://pkcargolink.com/icon-512.png",
      "description": "پاکستان میں اڈا منیجرز اور ٹرک ڈرائیورز کے لیے پروفیشنل لوڈ سلپ بنانے اور واٹس ایپ پر محفوظ لنک شیئر کرنے کا جدید نظام۔",
      "areaServed": {
        "@type": "Country",
        "name": "Pakistan"
      }
    }
    </script>

    <!-- Microsoft Clarity Analytics -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yre8kxhnhq");
    </script>

    <!-- PK Cargo Link loading splash: clean logo + spinner shown until React mounts,
         so visitors never see a blank page while the app loads -->
    <style>
      #pkcl-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #0B2A5B 0%, #123A6D 60%, #08284F 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; transition: opacity .45s ease;
      }
      #pkcl-splash.pkcl-splash-hide { opacity: 0; pointer-events: none; }
      .pkcl-splash-logo {
        width: 84px; height: 84px; border-radius: 26px;
        background: linear-gradient(135deg, #FFC531 0%, #F5A301 60%, #E8930C 100%);
        display: flex; align-items: center; justify-content: center;
        font-size: 34px; font-weight: 800; color: #0B2A5B;
        font-family: system-ui, -apple-system, sans-serif;
        box-shadow: 0 12px 32px rgba(245,163,1,.35);
      }
      .pkcl-splash-title { color: #fff; font-size: 24px; font-weight: 800; font-family: system-ui, -apple-system, sans-serif; }
      .pkcl-splash-title .pkcl-amber { color: #F5A301; }
      .pkcl-spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3.5px solid rgba(255,255,255,.18);
        border-top-color: #F5A301;
        animation: pkcl-spin .8s linear infinite;
      }
      @keyframes pkcl-spin { to { transform: rotate(360deg); } }
      .pkcl-splash-sub { color: #a7f3d0; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-nafees selection:bg-emerald-600 selection:text-white">
    <div id="pkcl-splash">
      <div class="pkcl-splash-logo">PK</div>
      <div class="pkcl-splash-title">PK Cargo <span class="pkcl-amber">Link</span></div>
      <div class="pkcl-spinner"></div>
      <div class="pkcl-splash-sub">لوڈ ہو رہا ہے</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
