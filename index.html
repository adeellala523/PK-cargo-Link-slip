<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="Permissions-Policy" content="microphone=(self '*')" />
    <title>PK Cargo Link — ڈیجیٹل کارگو، لوڈ سلپ اور ٹرانسپورٹ پلیٹ فارم</title>
    <meta name="description" content="PK Cargo Link کے ذریعے لوڈ تلاش کریں، ڈیجیٹل لوڈ سلپ بنائیں، سلپ ویریفائی کریں اور کارگو کام آسان بنائیں۔" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#123A6D" />
    <meta name="application-name" content="PK Cargo Link" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PK Cargo Link" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- OpenGraph & Social Sharing Meta (Dynamic in slip.php) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="کارگو اڈا لوڈ سلپ" />
    <meta property="og:title" content="لوڈ سلپ – گڈز ٹرانسپورٹ اڈا" />
    <meta property="og:description" content="دستیاب مال، روٹ اور اڈا رابطہ کی تفصیلات۔" />
    <meta property="og:url" content="https://pkcargolink.com" />
    <meta property="og:image" content="https://pkcargolink.com/slip-preview.jpg?v=3" />
    <meta property="og:image:secure_url" content="https://pkcargolink.com/slip-preview.jpg?v=3" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ur_PK" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="لوڈ سلپ – گڈز ٹرانسپورٹ اڈا" />
    <meta name="twitter:description" content="دستیاب لوڈ کی تفصیلات اور اڈا رابطہ۔" />
    <meta name="twitter:image" content="https://pkcargolink.com/api/slip-image.php" />

    <!-- Font preload for Nafees Web Naskh -->
    <link rel="preload" href="/fonts/nafeesweb.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LogisticsService",
      "name": "PK Cargo Link",
      "url": "https://pkcargolink.com",
      "logo": "https://pkcargolink.com/icon-512.png",
      "description": "پاکستان میں اڈا منیجرز اور ٹرک ڈرائیورز کے لیے پروفیشنل لوڈ سلپ بنانے اور واٹس ایپ پر محفوظ لنک شیئر کرنے کا جدید نظام۔",
      "areaServed": {
        "@type": "Country",
        "name": "Pakistan"
      }
    }
    </script>

    <!-- Microsoft Clarity Analytics -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yre8kxhnhq");
    </script>

    <!-- PK Cargo Link loading splash: truck animation shown until React mounts,
         so visitors never see a blank page while the app loads -->
    <style>
      #pkcl-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #123A6D 0%, #08284F 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; transition: opacity .45s ease;
      }
      #pkcl-splash.pkcl-splash-hide { opacity: 0; pointer-events: none; }
      .pkcl-splash-truck { font-size: 72px; line-height: 1; animation: pkcl-truck-bounce 1.1s ease-in-out infinite; filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
      @keyframes pkcl-truck-bounce { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
      .pkcl-splash-road { width: 230px; height: 7px; border-radius: 4px;
        background: repeating-linear-gradient(90deg, #19A974 0 26px, rgba(255,255,255,.18) 26px 48px);
        animation: pkcl-road-move .55s linear infinite; }
      @keyframes pkcl-road-move { to { background-position-x: -48px; } }
      .pkcl-splash-title { color: #fff; font-size: 24px; font-weight: 800; }
      .pkcl-splash-sub { color: #a7f3d0; font-size: 14px; font-weight: 600; }
      .pkcl-splash-sub::after { content: ''; animation: pkcl-dots 1.2s steps(4) infinite; }
      @keyframes pkcl-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-nafees selection:bg-emerald-600 selection:text-white">
    <div id="pkcl-splash">
      <div class="pkcl-splash-truck">🚚</div>
      <div class="pkcl-splash-road"></div>
      <div class="pkcl-splash-title">PK Cargo Link</div>
      <div class="pkcl-splash-sub">لوڈ ہو رہا ہے</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
